[project]
name = "flock"
version = "0.1.0"
description = "Multi-agent predator-prey RL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax[cpu]",
    "equinox",
    "optax",
    "jaxtyping",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "seaborn>=0.13.2",
]
