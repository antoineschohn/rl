[project]
name = "flock"
version = "0.1.0"
description = "Multi-agent predator-prey RL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax[cpu]",
    "equinox",
    "optax",
    "jaxtyping",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
